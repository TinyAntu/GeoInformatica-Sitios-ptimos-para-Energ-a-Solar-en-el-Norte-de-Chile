# Rutas de datos (separadas por crudos, procesados y resultados)
paths:
  raw:
    rasters:
      ghi: "data/raw/GHI.tif"
      dem_folders:
        - "data/raw/Norte_Region_II_DEM"
        - "data/raw/Norte_Region_III_DEM"
    vectores:
      regiones:       "data/raw/REGIONES/REGIONES_v1.shp"
      fotovoltaicas:  "data/raw/Paneles.gdb"
      lineas:         "data/raw/Linea_de_Transmision/Línea_de_Transmisión.shp"
      almacenamiento: "data/raw/Almacenamiento_de_Energia/Almacenamiento_de_Energía.shp"
      subestaciones:  "data/raw/Subestaciones/Subestaciones.shp"
      
      # Zonas de exclusión: candidatos negativos dentro de estas áreas son descartados
      areas_pobladas:  "data/raw/Areas_Pobladas/Areas_Pobladas.shp"
      masas_lacustres: "data/raw/Masas_Lacustres/masas_lacustres.shp"
      snap:            "data/raw/SNAP_ Mayo 2026/SNAP_.shp"
  processed:
    ghi_32719: "data/processed/GHI_32719.tif"
    dem_32719: "data/processed/dem_norte_32719.tif"
    slope:     "data/processed/slope_norte.tif"
    aspect:    "data/processed/aspect_norte.tif"
  results:
    dataset_ml: "data/results/dataset_entrenamiento_rf.shp"
    model_rf:   "data/results/model_rf.pkl"
    postgis_sql: "data/results/cargar_instalaciones_postgis.sql"
    postgis_report: "data/results/reporte_validacion_postgis.json"
    valid_sites_shp: "data/results/instalaciones_optimas_validadas.shp"

# Configuración de validación y carga en PostGIS
postgis_validation:
  target_srid: 32719
  prob_min: 0.70
  min_area_m2: 10000.0
  duplicate_tolerance_m: 50.0
  table_name: "instalaciones_solares_optimas"
  schema: "public"
  connection:
    host: "localhost"
    port: 5433              # contenedor postgis/postgis (el 5432 es postgres vanilla, sin PostGIS)
    dbname: "geoinformatica_db"
    user: "postgres"
    password: ""            # NO versionar la contraseña aquí: pásala por la variable de entorno PGPASSWORD
  bounds_utm:
    min_x: 100000.0
    max_x: 900000.0
    min_y: 6000000.0
    max_y: 8500000.0
  bounds_geo:
    min_lon: -72.5
    max_lon: -66.5
    min_lat: -30.0
    max_lat: -17.0

# Integración con el motor Rust solarpv-rs (mapa de rendimiento kWh/kWp/año).
# El binario se compila aparte: cargo build --release -p solarpv-cli --features terrain
# La validación de CRS/extensión reutiliza postgis_validation.target_srid y bounds_utm.
solarpv:
  binario: "solarpv-rs/target/release/solarpv"  # ejecutable compilado ([[bin]] name = "solarpv")
  lat: -23.6          # latitud de referencia (Antofagasta/Atacama)
  lon: -69.5          # longitud de referencia
  date: "2026-01-01"  # fecha base para la simulación anual
  dem: "data/processed/dem_norte_32719.tif"  # DEM de entrada (mismo del pipeline)
  out_prefix: "data/results/rendimiento"     # salida: data/results/rendimiento_specific_yield.tif
  # Remuestreo del DEM antes de correr el motor (controla runtime/memoria).
  # El motor corre ~25k celdas/s: el DEM nativo (~90 m, 86 M celdas) tarda ~1 h.
  #   300  -> ~7.7 M celdas, ~5 min. Recomendado para demo/iteración.
  #   null -> resolución nativa del DEM (~90 m): máxima fidelidad de terreno, ~1 h.
  resolucion_m: 300
  montaje:
    tilt: 23            # inclinación (grados) para montaje fijo
    surface_azimuth: 0  # azimut de la superficie (0 = mirando al norte en HS)
    gcr: 0.3            # ground coverage ratio para el seguidor de un eje

# Parámetros AHP y criterios de elegibilidad para candidatos negativos
criterios:
  ghi_min:   160
  slope_max: 15
  dist_max:  20000
  elev_max:  3500

# Preprocesamiento del DEM
preprocesamiento:
  dem_resolucion_m: 90

# Zona con la que se ENTRENÓ el modelo. Define a qué regiones se recorta la grilla de
# inferencia y la infraestructura contra la que se miden las distancias.
# Se declaran dos formas del mismo dato porque las capas no son consistentes: REGIONES_v1.shp
# usa nombres completos ('Antofagasta'), mientras Paneles.gdb, Subestaciones y Almacenamiento
# usan códigos numéricos ('02'). El filtro prueba la columna REGION contra `codigos` y, si la
# capa no tiene esa columna, recorta espacialmente contra `regiones`.
zona_estudio:
  regiones: ["Antofagasta", "Atacama"]
  codigos:  [2, 3, "2", "3", "02", "03", "II", "III", "Antofagasta", "Atacama"]

# Evaluación de GENERALIZACIÓN: aplicar el modelo YA ENTRENADO sobre una región que no
# participó del entrenamiento, sin reentrenar nada (scripts/run_zona.py --zona transferibilidad).
#
# Todos los productos van a un directorio propio: los scripts del pipeline escriben en rutas
# fijas de data/results/ y correrlos sobre otra zona sobrescribiría los artefactos del norte
# que cita el informe.
#
# El DEM se bajó de USGS/SRTMGL1_003 vía Google Earth Engine (ver obtencion_datos.py), que es
# el MISMO producto NASA que las teselas .hgt del norte: 1 arco-segundo (~30 m), EPSG:4326,
# int16. Así recorre exactamente la misma cadena que el norte (fusión -> reproyección a 32719
# a 90 m bilinear -> surtgis). Esto no es un detalle de rendimiento: la pendiente depende de
# la resolución del DEM, así que si Coquimbo llegara a slope por otro camino la prueba mediría
# procesamiento en vez de geografía.
#
# `dem_nodata: 0` porque la exportación de GEE no aplicó unmask(-32768) y dejó el exterior del
# polígono en 0 (37,8 % del ráster). Dentro de la región solo el 0,17 % de las celdas vale
# exactamente 0 (~69 km² de franja costera), así que el costo de tratarlo como nodata es nulo.
transferibilidad:
  regiones: ["Coquimbo"]
  codigos:  [4, "4", "04", "IV", "Coquimbo"]
  dem_folders:
    - "data/raw/Norte_Region_IV_DEM"
  dem_patron:  "*.tif"
  dem_nodata:  0
  dem:      "data/processed/dem_coquimbo_32719.tif"
  slope:    "data/processed/slope_coquimbo.tif"
  aspect:   "data/processed/aspect_coquimbo.tif"
  # Misma resolución de grilla que el LORO del norte (shap_espacial/perfiles_inversion), para
  # que las cifras sean comparables sin corregir por resolución.
  resolucion_m: 500
  ha_por_mw: 2.0
  dir_resultados: "data/results/coquimbo"
  dir_figuras:    "figures/coquimbo"
  # Latitud/longitud de referencia para el motor Rust. Solo fija el encabezado de la
  # simulación: con `per_cell_lat: true` la geometría solar se recalcula celda a celda.
  # El MONTAJE (tilt 23°, azimut, gcr) NO se cambia a propósito, aunque 23° no sea el óptimo
  # de esta latitud: el cruce aptitud-rendimiento usa Spearman, que es de rangos, y mantener
  # el montaje fijo entre zonas evita mezclar geografía con elección de diseño.
  lat: -30.6
  lon: -70.8

# Parámetros de validación espacial (SBCV / LOROCV)
validacion:
  tamano_bloque_km: 30   # Lado del bloque cuadrado para Spatial Block CV (en km)

# Grilla de salida del mapa de aptitud ML (hallazgo 2.1)
salida_mapa:
  # Resolución (m) de la grilla de inferencia. Más fina => distancias a infraestructura
  # más cercanas a las exactas del entrenamiento, pero más memoria.
  #   100  -> ~45 M px, ~1.4 GB pico (10x más fino que el GHI de 1 km). Recomendado.
  #   null -> resolución nativa del DEM (~30 m): ~500 M px, ~16 GB pico. Solo con mucha RAM.
  resolucion_m: 100

# Parámetros del Modelo de Machine Learning
ml_params:
  ratio_negativos: 3    # Ratio principal 1:3 (positivas:negativas)
  ratio_alt:       10   # Ratio alternativo para análisis de sensibilidad
  random_state:    42
  n_estimators:    500

# Parametros para Optuna
optuna_params:
  n_trials: 50
  n_estimators:
    min: 100
    max: 1000
    step: 100
  max_depth:
    min: 3
    max: 15
  min_samples_leaf:
    min: 2
    max: 10

# Explicabilidad espacial SHAP (Brecha 8). Grilla más gruesa que el mapa de aptitud porque
# calcular SHAP por píxel es caro (500 m ≈ pocos min; 100 m = decenas de millones de píxeles).
shap_espacial:
  resolucion_m: 500
  top_sitios: 5

# Consenso vs. divergencia entre perfiles (Brecha 6, punto 4). Un píxel es "apto" en un
# perfil si está en el top (100-percentil)% de ese perfil (comparación relativa: los 3
# perfiles están en escalas distintas). Consenso = apto en los 3; divergencia = en 1 o 2.
consenso_perfiles:
  percentil_apto: 90   # 90 => top 10% de cada perfil

# Perfiles de inversión (pesos AHP/WLC). El perfil 'balanceado' se carga dinámicamente
# desde los resultados del modelo ML.
# Lectura fijo vs. seguidor (T3, data/results/comparacion_montaje.json): sobre nuestro DEM
# el seguidor de un eje rinde ~+52% sobre el montaje fijo en las zonas aptas (por encima
# del ~+36% de referencia del autor del motor). El perfil 'agresivo' (prioriza
# radiación/rendimiento) capitaliza esa ganancia; el 'conservador' (prioriza cercanía a
# infraestructura) la pondera contra el mayor CAPEX/mantenimiento del seguidor. No se
# modifican las matrices AHP: la comparación es una lectura, no un cambio de pesos.
perfiles_inversion:
  # Resolución de la grilla de scripts/profiles.py (mapas AHP conservador/agresivo). Usa el
  # DEM como base, NO el GHI (~1 km) ni la resolución del mapa RF (salida_mapa.resolucion_m,
  # 100 m): a 100 m este script mantiene ~15 arrays completos en memoria a la vez y puede
  # agotar la RAM. 500 m sigue siendo ~2x más fino que el GHI original (mismo criterio de
  # costo que shap_espacial.resolucion_m). Baja este valor si igual te quedas sin memoria.
  resolucion_m: 500
  conservador:
    ghi: 0.10
    dist_transmision: 0.40
    dist_almacen: 0.15
    dist_subestaciones: 0.15
    slope: 0.10
    elev: 0.10
    northness: 0.00
  agresivo:
    ghi: 0.60
    dist_transmision: 0.10
    dist_almacen: 0.05
    dist_subestaciones: 0.05
    slope: 0.10
    elev: 0.10
    northness: 0.00

# Baseline AHP formal (hallazgo 3.3): matrices de comparación por pares (escala de Saaty 1–9)
# por perfil. Los pesos se derivan del autovector principal de cada matriz y se validan con el
# Ratio de Consistencia (CR < 0.10). Si un perfil tiene matriz aquí, profiles.py usa estos pesos
# AHP; si no, cae en 'perfiles_inversion'. Reemplaza las matrices con tus juicios de experto;
# el orden de filas/columnas sigue 'criterios'. (Matrices semilla verificadas: CR<0.10.)
ahp_perfiles:
  criterios: [ghi, slope, elev, northness, dist_transmision, dist_almacen, dist_subestaciones]
  conservador:   # prioriza cercanía a infraestructura (CR = 0.0012)
    matriz:
      - [1,      1,      1,      3, 0.25,   0.5, 0.5]
      - [1,      1,      1,      3, 0.25,   0.5, 0.5]
      - [1,      1,      1,      3, 0.25,   0.5, 0.5]
      - [0.3333, 0.3333, 0.3333, 1, 0.1111, 0.2, 0.2]
      - [4,      4,      4,      9, 1,      2,   2]
      - [2,      2,      2,      5, 0.5,    1,   1]
      - [2,      2,      2,      5, 0.5,    1,   1]
  agresivo:      # prioriza radiación (GHI) sobre logística (CR = 0.0205)
    matriz:
      - [1,      6,   6,   9, 6,   9,      9]
      - [0.1667, 1,   1,   5, 1,   2,      2]
      - [0.1667, 1,   1,   5, 1,   2,      2]
      - [0.1111, 0.2, 0.2, 1, 0.2, 0.3333, 0.3333]
      - [0.1667, 1,   1,   5, 1,   2,      2]
      - [0.1111, 0.5, 0.5, 3, 0.5, 1,      1]
      - [0.1111, 0.5, 0.5, 3, 0.5, 1,      1]
